<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#172019" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Path Of Strength" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Path Of Strength - The Practice Is the Path</title>
  <style>
    :root{
      --bg:#172019;
      --surface:#f7efe0;
      --surface2:#efe2ca;
      --text:#251b13;
      --muted:#725f4a;
      --line:#d4bd94;
      --acc:#b84a2f;
      --gold:#b88a37;
      --ink:#18231d;
      --good:#436f48;
      --mid:#9a7831;
      --rec:#506f83;
      --danger:#8d3e34;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      padding:calc(14px + var(--device-top,0px)) calc(14px + var(--device-right,0px)) max(160px,18vh) calc(14px + var(--device-left,0px));
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#eee4d2;
      isolation:isolate;
      color:var(--text);
      min-height:100vh;
    }
    body::before{
      content:"";position:fixed;inset:auto 0 0;height:65vw;max-height:70vh;z-index:-1;pointer-events:none;
      background:url("scene-temple.jpg") center bottom / 100% auto no-repeat;
      -webkit-mask-image:linear-gradient(to bottom,transparent 12%,#000 45%);
      mask-image:linear-gradient(to bottom,transparent 12%,#000 45%);
    }
    .wrap{ max-width:1060px; margin:0 auto; display:grid; gap:14px; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .card{
      background: rgba(247,239,224,0.90);
      border:1px solid var(--line);
      border-radius:8px;
      padding:16px;
      box-shadow: 0 18px 48px rgba(5,10,6,0.28);
      backdrop-filter: blur(8px);
    }
    .masthead{
      position:relative;
      overflow:hidden;
      min-height:clamp(205px, 30vw, 300px);
      display:grid;
      align-items:end;
      border-color: rgba(231,183,91,0.54);
      background:
        linear-gradient(90deg, rgba(12,18,13,0.68), rgba(12,18,13,0.26) 52%, rgba(12,18,13,0.04)),
        linear-gradient(180deg, rgba(0,0,0,0.00), rgba(0,0,0,0.28)),
        url("scene-carry.jpg") 72% center / cover;
      color:#f7efe0;
    }
    .masthead::before{
      content:"";
      position:absolute; left:18px; right:18px; top:0;
      height:8px;
      background: linear-gradient(90deg, transparent, var(--acc), var(--gold), var(--acc), transparent);
      opacity:.95;
    }
    .masthead::after{
      content:"";
      position:absolute; right:16px; top:16px;
      width:74px; height:42px;
      border-top:7px solid rgba(247,239,224,0.22);
      border-left:28px solid transparent;
      border-right:28px solid transparent;
      opacity:.65;
    }
    .masthead h1{ color:#f7efe0; text-shadow:0 2px 14px rgba(0,0,0,0.52); }
    .masthead .small{ color:#e6c98c; text-shadow:0 1px 10px rgba(0,0,0,0.50); }
    .brand{
      display:flex;
      gap:16px;
      align-items:center;
      padding-right:72px;
      width:min(620px, 100%);
      padding:14px;
      border:1px solid rgba(231,183,91,0.26);
      border-radius:8px;
      background: rgba(17,25,19,0.44);
      backdrop-filter: blur(6px);
    }
    .brand-logo{
      width:112px;
      height:112px;
      object-fit:contain;
      flex:0 0 auto;
      border-radius:8px;
      box-shadow:0 10px 28px rgba(0,0,0,0.28);
    }
    .brand-copy{ min-width:0; }
    .hero-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-top:14px;
    }
    .btn.main-action{
      min-height:52px;
      padding:14px 20px;
      border-radius:999px;
      border-color: rgba(247,239,224,0.72);
      background:
        linear-gradient(135deg, rgba(184,74,47,0.96), rgba(184,138,55,0.92));
      color:#fff8e8;
      font-size:15px;
      letter-spacing:.04em;
      text-transform:uppercase;
      box-shadow: 0 14px 34px rgba(5,10,6,0.38), inset 0 1px 0 rgba(255,255,255,0.24);
    }
    .btn.main-action:hover{
      border-color: rgba(255,250,239,0.92);
      filter:saturate(1.08);
    }
    .hero-actions #btnReset{
      color:#f2dec0;
      border-color: rgba(247,239,224,0.36);
      background: rgba(17,25,19,0.38);
    }
    .hero-actions #btnInstall{
      display:none;
      color:#f2dec0;
      border-color: rgba(247,239,224,0.36);
      background: rgba(17,25,19,0.38);
    }
    .hero-actions #btnInstall.show{ display:inline-flex; }
    .hero-actions #trainPill{
      color:#f2dec0;
      border-color: rgba(247,239,224,0.30);
      background: rgba(17,25,19,0.44);
    }
    .hero-actions #trainPill strong{ color:#fff8e8; }
    @media (max-width: 520px){
      .brand{
        gap:12px;
        padding-right:0;
      }
      .brand-logo{
        width:86px;
        height:86px;
      }
      .masthead::after{ display:none; }
    }
    h1{ font-size:20px; margin:6px 0 6px; letter-spacing:.02em; }
    h2{ font-size:15px; margin:0 0 8px; color:var(--text); }
    p{ margin:0; color:var(--muted); line-height:1.35; font-size:13px; }
    .btn{
      appearance:none;
      border:1px solid rgba(32,40,34,0.12);
      background: rgba(255,250,239,0.58);
      color:var(--text);
      border-radius:8px;
      padding:10px 12px;
      font-weight:780;
      cursor:pointer;
      transition: transform .04s ease, background .12s ease, border-color .12s ease, opacity .12s ease;
      user-select:none;
    }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{
      border-color: rgba(184,74,47,0.44);
      background: rgba(184,74,47,0.10);
      color:#5c2419;
    }
    .btn.danger{
      border-color: rgba(154,82,72,0.24);
      background: rgba(154,82,72,0.045);
      color: var(--danger);
    }
    .btn.good{
      border-color: rgba(75,139,96,0.38);
      background: rgba(75,139,96,0.10);
    }
    .btn.mid{
      border-color: rgba(154,120,49,0.35);
      background: rgba(154,120,49,0.10);
    }
    .btn.rec{
      border-color: rgba(93,120,148,0.35);
      background: rgba(93,120,148,0.08);
    }
    .btn:disabled{ opacity:.45; cursor:not-allowed; }

    .pill{
      display:inline-flex; gap:6px; align-items:center;
      padding:6px 10px; border-radius:999px;
      border:1px solid rgba(32,40,34,0.12);
      background: rgba(255,250,239,0.56);
      color:var(--muted);
      font-size:12px;
    }
    .pill strong{ color:var(--text); }
    .pill.big-six{
      color:#6b4710;
      border-color:rgba(184,138,55,.52);
      background:rgba(184,138,55,.16);
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.04em;
    }
    .grid{ display:grid; grid-template-columns: 1fr; gap:14px; }
    body.has-timer{ padding-bottom:var(--timer-dock-space,160px); }
    #rightCard{ display:none; }
    #rightCard.active{
      display:block;position:fixed;left:12px;right:12px;bottom:calc(8px + var(--device-bottom,0px));top:auto;
      max-width:700px;margin:0 auto;z-index:100;
      padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
      background:#f7efe0;border-color:rgba(184,138,55,.64);
      box-shadow:0 -6px 28px rgba(5,10,6,.28);
    }
    #rightInner{ display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 12px; }
    #rightCard h2{margin:0;font-size:14px;min-width:0;}
    #rightCard .label,#rightCard #sub{display:none;}
    #rightCard .time{font-size:30px;grid-column:2;grid-row:1;}
    #rightCard .timer-actions{grid-column:1/-1;display:flex;flex-wrap:nowrap;gap:6px;margin-top:0!important;}
    #rightCard .timer-actions .btn{flex:1 1 0;min-width:0;min-height:44px;padding:8px 5px;font-size:12px;white-space:nowrap;}
    #btnRest[aria-pressed="true"]{background:rgba(75,139,96,.20);border-color:#4b8b60;}
    .masthead .brand{padding:10px;gap:12px;}
    .masthead .brand-logo{width:64px;height:64px;}
    .masthead .hero-actions{margin-top:12px;gap:8px;}
    .masthead .main-action{min-height:44px;padding:10px 16px;font-size:13px;}
    body.practicing .masthead{min-height:0;padding:12px;gap:10px;background-position:center 62%;}
    body.practicing .brand{padding:0;border:0;background:none;backdrop-filter:none;}
    body.practicing .brand-logo{width:44px;height:44px;}
    body.practicing .masthead h1{font-size:17px;margin:0;}
    body.practicing .brand-copy .small{font-size:11px;}
    body.practicing .hero-actions{margin-top:0;}
    .gate-grid{gap:10px;}
    .gate-check{padding:12px;}
    .sectionTitle{ font-size:14px; margin:0 0 10px; color:var(--text); text-transform:uppercase; letter-spacing:.08em; }
    .sectionTitle::before{
      content:"";
      display:inline-block;
      width:18px;
      height:1px;
      margin-right:8px;
      vertical-align:middle;
      background: var(--gold);
    }
    .optionalCard{ opacity:.88; }
    .optionalCard .ex-title, .optionalCard .ex-meta{ font-style:italic; }
    .carryCard{ margin-top:0; }

    .hr{ height:1px; background:var(--line); margin:16px 0; }
    .small{ font-size:12px; color:var(--muted); }
    .time{
      font-variant-numeric: tabular-nums;
      font-size:46px; font-weight:850; letter-spacing:0; line-height:1;
      color: var(--ink);
      text-shadow: 0 1px 0 rgba(255,255,255,0.55);
    }
    .label{ color:var(--muted); font-size:12px; }
    .exercise{
      border:1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(184,74,47,0.055), transparent 32%),
        var(--surface2);
      border-radius:8px;
      padding:14px 14px;
      display:flex; gap:14px; justify-content:space-between; align-items:flex-start;
    }
    .ex-left{ display:grid; gap:6px; min-width:0; }
    .set-counter{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;}
    .set-counter .btn{min-width:44px;min-height:44px;padding:6px;font-size:19px;}
    .set-counter span{min-width:52px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;}
    .log-entry{padding:12px 0;border-bottom:1px solid var(--line);}
    .log-entry summary{cursor:pointer;}
    .log-exercise{padding:9px 0;font-size:13px;}
    .ex-title{ font-weight:820; font-size:15px; line-height:1.2; }
    .ex-meta{ color:var(--muted); font-size:12px; line-height:1.35; }
    .exercise-media{
      display:flex;
      gap:10px;
      align-items:center;
      flex:0 0 auto;
    }
    .exercise-thumb-btn{
      width:58px;
      height:58px;
      border:1px solid rgba(32,40,34,0.12);
      border-radius:12px;
      padding:0;
      overflow:hidden;
      background:rgba(255,250,239,0.54);
      cursor:pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.26);
    }
    .exercise-thumb{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      opacity:.88;
      filter:saturate(.86) contrast(.96);
    }
    .exercise-thumb-btn:active{ transform:translateY(1px); }
    .exercise-preview{
      width:min(100%, 520px);
      margin-top:12px;
      border:1px solid var(--line);
      border-radius:10px;
      overflow:hidden;
      background:var(--surface2);
    }
    .exercise-preview img{
      display:block;
      width:100%;
      height:auto;
    }
    .warmup{
      border:1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(184,138,55,0.10), transparent 40%),
        var(--surface2);
      border-radius:8px;
      padding:12px 14px;
      margin:0 0 16px;
    }
    .warmup summary{
      cursor:pointer;
      font-weight:850;
      user-select:none;
    }
    .warmup-list{
      display:grid;
      gap:6px;
      margin:10px 0 0;
      padding:0;
      list-style:none;
      color:var(--muted);
      font-size:13px;
    }

    /* Gate */
    .gate-grid{ display:grid; gap:16px; }
    .gate-check{
      display:grid;
      grid-template-columns:24px minmax(0,1fr);
      gap:14px;
      align-items:start;
      justify-content:start;
      text-align:left;
      cursor:pointer;
    }
    .gate-check input{ width:24px; height:24px; margin:0; accent-color:#89a879; }
    .gate-check-copy{ display:grid; gap:4px; min-width:0; line-height:1.4; }
    .gate-check-copy strong{ text-align:left; }
    .gate-check-copy .small{ display:block; text-align:left; }
    .gate-row{ display:grid; gap:8px; }
    .score-row{ display:flex; gap:8px; flex-wrap:wrap; }
    .score-btn{
      width:42px; height:36px;
      display:inline-flex; justify-content:center; align-items:center;
      border-radius:999px;
      border:1px solid rgba(32,40,34,0.14);
      background:rgba(255,250,239,0.62);
      color:var(--text);
      font-weight:760;
      cursor:pointer;
      user-select:none;
      transition: transform .04s ease, background .12s ease, border-color .12s ease;
    }
    .score-btn:active{ transform: translateY(1px); }
    .score-btn.active{
      border-color: rgba(184,74,47,0.48);
      background: rgba(184,74,47,0.12);
      color: #64281d;
    }
    .total{
      display:flex; gap:10px; align-items:center; justify-content:space-between;
      border:1px solid var(--line);
      background: var(--surface2);
      border-radius:8px;
      padding:12px 14px;
    }
    .total .n{ font-size:28px; font-weight:900; font-variant-numeric: tabular-nums; }
    .badge{
      padding:6px 10px; border-radius:999px; font-size:12px; font-weight:900;
      border:1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04);
      color: var(--muted);
    }
    .badge.good{ color: #315b3c; border-color: rgba(67,111,72,.34); background: rgba(67,111,72,.09); }
    .badge.mid{ color: #7a6027; border-color: rgba(184,138,55,.36); background: rgba(184,138,55,.10); }
    .badge.rec{ color: #405f7a; border-color: rgba(80,111,131,.34); background: rgba(80,111,131,.09); }

    /* Breathing */
    .breathBox{ display:grid; gap:12px; align-items:center; justify-items:center; padding:8px 0; }
    .ring{
      width:220px; height:220px; border-radius:999px;
      border: 2px solid rgba(184,138,55,0.26);
      background: rgba(255,250,239,0.42);
      display:grid; place-items:center;
      position: relative;
      overflow:hidden;
    }
    .ring::after{
      content:"";
      position:absolute; inset:12px;
      border-radius:999px;
      border: 1px solid rgba(32,40,34,0.08);
    }
    .ringInner{
      width:120px; height:120px; border-radius:999px;
      background: rgba(255,250,239,0.72);
      border: 1px solid rgba(184,138,55,0.22);
      display:grid; place-items:center;
      transition: transform 0.25s linear;
      z-index:1;
    }
    .phase{ font-weight:950; letter-spacing:.6px; text-align:center; }
    .phaseSub{ font-size:12px; color:var(--muted); margin-top:2px; text-align:center; }
    .progress{ width:100%; height:10px; border-radius:999px; border:1px solid rgba(32,40,34,0.12); background: rgba(255,255,255,0.55); overflow:hidden; }
    .progress > div{ height:100%; width:0%; background: linear-gradient(90deg, rgba(184,74,47,0.42), rgba(184,138,55,0.30)); }

    /* Confetti canvas */
    #confettiCanvas{ position:fixed; inset:0; pointer-events:none; z-index:9999; display:none; }
  
    .scale-legend{
      font-size:12px;
      color: var(--muted);
      opacity:.85;
      margin-top:6px;
      line-height:1.3;
    }
    
    .score-label{ margin-top:6px; min-height:18px; font-size:12px; color:var(--muted); font-weight:600; }
.score-btn.active{
      transform: scale(1.04);
      font-weight:700;
    }

    /* App modal (confirm + Bell Test reminder) */
    #appModal{
      position:fixed; inset:0;
      background: rgba(10,18,12,0.58);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:10000;
      padding:16px;
    }
    #appModal.show{ display:flex; }
    .modalCard{ max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;box-sizing:border-box;
      width:min(560px, 100%);
      border:1px solid var(--line);
      background: var(--surface);
      border-radius:8px;
      padding:14px;
      box-shadow: none;
    }
    .modalTitle{ font-size:15px; font-weight:900; margin:0 0 6px; }
    .modalText{ font-size:13px; color:var(--muted); margin:0; line-height:1.35; }
    .modalRow{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .modeChoiceCard{
      flex:1 1 100%;
      display:grid;
      grid-template-columns:92px minmax(0, 1fr);
      align-items:center;
      gap:12px;
      padding:8px;
      text-align:left;
    }
    .modeChoiceArt{
      width:92px;
      height:92px;
      overflow:hidden;
      border-radius:7px;
      background:#f4eee2;
    }
    .modeChoiceArt img{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
      transform:scale(1.16);
    }
    .modeChoiceCopy{ display:grid; gap:4px; }
    .modeChoiceCopy strong{ font-size:14px; }
    .modeChoiceCopy small{ color:var(--muted); font-size:12px; line-height:1.3; font-weight:650; }
    .modalList{ display:grid; gap:8px; margin-top:10px; }
    .modalItem{
      border:1px solid var(--line);
      background: rgba(0,0,0,0.18);
      border-radius:8px;
      padding:10px 12px;
      color:var(--text);
      font-size:13px;
    }
    .modalItem label{ display:flex; gap:10px; align-items:flex-start; cursor:pointer; }
    .modalItem input{ transform: translateY(2px); }
    .availabilityList{
      display:grid;
      gap:10px;
      max-height:min(62vh, 620px);
      overflow:auto;
      padding-right:2px;
    }
    .availabilityGroup{
      border:1px solid var(--line);
      border-radius:8px;
      background: rgba(255,250,239,0.48);
      overflow:hidden;
    }
    .availabilityGroup summary{
      cursor:pointer;
      user-select:none;
      padding:10px 12px;
      font-size:13px;
      font-weight:900;
      color:var(--text);
    }
    .availabilitySub{
      padding:0 12px 12px;
      display:grid;
      gap:8px;
    }
    .availabilitySubTitle{
      margin-top:6px;
      color:var(--muted);
      font-size:12px;
      font-weight:850;
      text-transform:uppercase;
      letter-spacing:.05em;
    }
    .availabilityRow{
      display:grid;
      grid-template-columns: minmax(160px, 1fr) minmax(150px, 1fr);
      gap:8px;
      align-items:center;
      padding:8px;
      border:1px solid rgba(32,40,34,0.10);
      border-radius:8px;
      background: rgba(255,250,239,0.56);
    }
    .availabilityRow.off{ opacity:.62; }
    .availabilityToggle{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:13px;
      font-weight:760;
      color:var(--text);
      min-width:0;
    }
    .availabilityToggle input{ flex:0 0 auto; }
    .availabilityReplacement{
      width:100%;
      min-width:0;
      border:1px solid rgba(32,40,34,0.16);
      border-radius:8px;
      background:rgba(255,250,239,0.72);
      color:var(--text);
      padding:9px 10px;
      font:inherit;
      font-size:13px;
    }
    .benchmarkGrid{ display:grid; gap:10px; margin-top:12px; }
    .benchmarkRow{
      display:grid;
      grid-template-columns:minmax(0,1fr) 92px;
      gap:10px;
      align-items:center;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:8px;
      background:rgba(255,250,239,.56);
    }
    .benchmarkInput{
      width:100%;
      padding:10px;
      border:1px solid rgba(32,40,34,.18);
      border-radius:8px;
      background:#fffaf0;
      color:var(--text);
      font:inherit;
      font-weight:850;
      text-align:center;
    }
    .benchmarkScore{
      font-variant-numeric:tabular-nums;
      font-size:48px;
      font-weight:900;
      line-height:1;
      text-align:center;
    }
    .benchmarkHistory{ display:grid; gap:8px; max-height:52vh; overflow:auto; }
    .benchmarkHistoryItem{
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:8px;
      background:rgba(255,250,239,.56);
    }
    @media (max-width: 620px){
      .availabilityRow{ grid-template-columns:1fr; }
    }


    /* A quiet paper journal, with the original brushwork kept in view. */
    .wrap{max-width:760px;gap:16px;}

(() => {

    const d = new Date();

  function getExtraPool(type){
    return (EXTRA_POOLS[type] || EXTRA_POOLS.core).slice();
  }

  function getTodayLesson(){
    if(window.BellWidget){
      try {
        const lesson = BellWidget.getLesson(
          localStorage.getItem(LS_LESSON_DAY_KEY) || "",
          localStorage.getItem(LS_LESSON_TODAY_KEY) || "",
          localStorage.getItem(LS_LESSON_KEY) || "[]");
        localStorage.setItem(LS_LESSON_DAY_KEY, todayKey());
        localStorage.setItem(LS_LESSON_TODAY_KEY, lesson);
        return lesson;
      } catch(e) { /* Browser lesson selection remains a fallback. */ }
    }
    const today = todayKey();
    const cachedDay = localStorage.getItem(LS_LESSON_DAY_KEY);
    const cachedLesson = localStorage.getItem(LS_LESSON_TODAY_KEY);
    if(cachedDay === today && cachedLesson){
      return cachedLesson;
    }
    const lesson = drawLesson();
    localStorage.setItem(LS_LESSON_DAY_KEY, today);
    localStorage.setItem(LS_LESSON_TODAY_KEY, lesson);
    return lesson;
  }

  function initTrainPillEditor(){
    const el = document.getElementById("trainPill");
    if(!el || el.dataset.longpressBound === "1") return;
    el.dataset.longpressBound = "1";

    let pressTimer = null;
    let longPressTriggered = false;

    const clearPressTimer = () => {
      if(pressTimer){
        clearTimeout(pressTimer);
        pressTimer = null;
      }
    };

    const openCountEditor = () => {
      longPressTriggered = true;
      const current = (loadTrainCount().n || 0);
      const raw = window.prompt("Set Practice counter (0-999):", String(current));
      if(raw === null) return;
      const parsed = Number(raw);
      if(!Number.isFinite(parsed)) return;
      const next = Math.max(0, Math.min(999, Math.round(parsed)));
      const tc = loadTrainCount();
      tc.n = next;
      saveTrainCount(tc);
      updateTrainPill();
      try{ maybeShowBellTestReminder(); }catch{}
    };

    const startPress = () => {
      clearPressTimer();
      longPressTriggered = false;
      pressTimer = setTimeout(openCountEditor, 700);
    };

    const endPress = (e) => {
      if(longPressTriggered && e){
        e.preventDefault();
        e.stopPropagation();
      }
      clearPressTimer();
      setTimeout(() => { longPressTriggered = false; }, 0);
    };

    el.addEventListener("touchstart", startPress, { passive: true });
    el.addEventListener("touchend", endPress);
    el.addEventListener("touchcancel", endPress);
    el.addEventListener("mousedown", startPress);
    el.addEventListener("mouseup", endPress);
    el.addEventListener("mouseleave", endPress);
    el.addEventListener("contextmenu", (e) => e.preventDefault());

  function benchmarkCycleSessions(){

      if(r.kind!=='training'||!['kettlebell','barbell','bodyweight'].includes(r.modality||'kettlebell')||!Number.isFinite(r.completedAt)||r.completedAt<Number(cycle.startedAt)||r.completedAt>now||seen.has(r.id))continue;
      seen.add(r.id);const d=new Date(r.completedAt),fallback=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

  function finishBellTest(draft){
    if(benchmarkUiTimer) clearInterval(benchmarkUiTimer);
    benchmarkUiTimer = null;
    const skillsPassed = BENCHMARK_SKILLS.every(skill => Number(draft.skills?.[skill.key]) >= skill.max);
    const mastered = skillsPassed;
    const score = benchmarkScore(draft.skills);
    const candidateBellKg = Number(draft.candidateBellKg || draft.bellKg || getCandidateBellKg());
    const currentBellKg = Number(draft.currentBellKg || getCurrentBellKg());
    const history = loadBenchmarkHistory();
    const sameCandidate = history.filter(item => Number(item.candidateBellKg || item.bellKg) === candidateBellKg);
    const previousSameBell = sameCandidate.slice(-1)[0];
    const previousScore = previousSameBell
      ? (Number.isFinite(Number(previousSameBell.score)) ? Number(previousSameBell.score) : Math.min(100, Number(previousSameBell.snatchReps) || 0))
      : null;
    const previousBest = sameCandidate.reduce((best,item) => {
      const itemScore = Number.isFinite(Number(item.score)) ? Number(item.score) : Math.min(100, Number(item.snatchReps) || 0);
      return Math.max(best, itemScore);
    }, 0);
    const record = {
      date:Date.now(),
      bellKg:candidateBellKg,
      currentBellKg,
      candidateBellKg,
      skills:draft.skills,
      score,
      mastered,
      deltaFromPrevious:previousScore === null ? null : score - previousScore,
      personalBest:score > previousBest
    };
    history.push(record);
    recordWidgetCompletion("training");
    saveBenchmarkHistory(history);
    localStorage.removeItem(LS_BENCHMARK_DRAFT_KEY);
    startBenchmarkCycle(mastered ? "bell-up" : "test-attempt");

  function maybeShowBellTestReminder(){
    if(!welcomeAccepted()||localStorage.getItem('pos_intro_seen_v1')!==WELCOME_VERSION)return;
    if(getPracticeMode() !== "progression") return;
    if(localStorage.getItem(LS_ONBOARDING_KEY) !== "1") return;
    if(loadActive()||openingDue()) return;
    if(appModal && appModal.classList.contains("show")) return;
    const sessions = benchmarkCycleSessions();
    if(sessions < 42) return;
    const tier = sessions >= 56 ? "push" : "nudge";

  // Synthesized bell tones: available offline, without downloads or audio files.
  let timerAudioContext=null;
  function prepareTimerAudio(){
    try{
      const AudioContext=window.AudioContext||window.webkitAudioContext;
      if(!AudioContext)return null;
      if(!timerAudioContext||timerAudioContext.state==='closed')timerAudioContext=new AudioContext();
      if(timerAudioContext.state==='suspended')timerAudioContext.resume().catch(()=>{});
      return timerAudioContext;
    }catch{return null;}
  }
  function scheduleBellTone(ctx,kind){
    const gong=kind==='gong',now=ctx.currentTime+0.015;
    // Frequency, peak gain, decay length. Close modes give the gong a gentle beat.
    const modes=gong?
      [[196,.23,7.5],[197.2,.035,6.5],[384.2,.13,6],[541,.075,4.5],[813,.04,3],[1186,.018,1.8]]:
      [[1320,.25,1.8],[2634,.085,1.25],[3696,.04,.85],[5530,.012,.4]];
    for(const [frequency,level,duration] of modes){
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      const attack=gong?0.025:0.006;
      osc.type='sine';osc.frequency.setValueAtTime(frequency,now);
      if(gong)osc.frequency.exponentialRampToValueAtTime(frequency*.998,now+duration);
      gain.gain.setValueAtTime(0,now);
      gain.gain.linearRampToValueAtTime(level,now+attack);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+duration);
      gain.gain.linearRampToValueAtTime(0,now+duration+.05);
      osc.connect(gain);gain.connect(ctx.destination);
      osc.onended=()=>{osc.disconnect();gain.disconnect();};
      osc.start(now);osc.stop(now+duration+.06);
    }
  }
  async function playTimerSound(kind){
    try{
      if(window.BellAudio && typeof BellAudio.play==='function'){BellAudio.play(kind);return;}
      const ctx=prepareTimerAudio();if(!ctx)return;
      if(ctx.state!=='running')await ctx.resume();
      scheduleBellTone(ctx,kind);
    }catch{}
  }

  function beep(times=3){
    try{
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioContext();
      const now = ctx.currentTime;
      for(let i=0;i<times;i++){
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = i % 2 === 0 ? 880 : 1320;
        gain.gain.setValueAtTime(0.0001, now + i*0.28);
        gain.gain.exponentialRampToValueAtTime(0.85, now + i*0.28 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.28 + 0.22);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now + i*0.28);
        osc.stop(now + i*0.28 + 0.22);
      }
      setTimeout(() => ctx.close(), times * 280 + 500);
    }catch{}
  }

  // -------------------------
  // Timer helper

  function fmt(sec){ const m=Math.floor(sec/60); const s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }

  function makeTimer(totalSeconds, onTick){
    return {
      total: totalSeconds,
      left: totalSeconds,
      running: false,
      _t: null,
      _endAt: null,
      _persistTick: onTick,
      _notify(){
        const f = this._onTick || onTick;
        f && f(this.left, this.total);
      },
      sync(){
        if(this.running && this._endAt){
          this.left = Math.max(0, Math.ceil((this._endAt - Date.now()) / 1000));
        }
        this._notify();
      },
      start(onDone){
        if(this.running) return;
        this.running = true;
        this._endAt = Date.now() + (Math.max(0, this.left) * 1000);
        const tick = () => {
          if(!this.running) return;
          this.left = Math.max(0, Math.ceil((this._endAt - Date.now()) / 1000));
          this._notify();
          if(this.left <= 0){
            this.running=false; this._t=null;
            try{ onDone && onDone(); }catch{}
            return;
          }
          const nextDelay = Math.max(250, Math.min(1000, this._endAt - Date.now() - ((this.left - 1) * 1000)));
          this._t = setTimeout(tick, nextDelay);
        };
        tick();
      },
      pause(){ this.sync(); this.running=false; this._endAt=null; if(this._t) clearTimeout(this._t); this._t=null; },
      reset(){ this.pause(); this.left=this.total; this._notify(); },
      setTotal(totalSeconds){ this.pause(); this.total=totalSeconds; this.left=totalSeconds; this._notify(); },
    };
  }

      extraBags:{ core:[], hypertrophy:[] },
      patterns:{}

    const parsed = loadJSON(LS_MEM_KEY);

        mem.nextExtraType = parsed.nextExtraType;

  // Random helpers
  function randInt(n){ return Math.floor(Math.random()*n); }
  function choice(arr){ return arr[randInt(arr.length)]; }
  function weightedChoice(items, weights){
    if(!items.length) return null;
    const total = items.reduce((sum, item) => sum + Math.max(0, Number(weights[item]) || 0), 0);
    if(total <= 0) return choice(items);
    let roll = Math.random() * total;
    for(const item of items){
      roll -= Math.max(0, Number(weights[item]) || 0);
      if(roll < 0) return item;
    }
    return items[items.length - 1];
  }
  function progressionWeights(patternKey, subcatKey){
    const key = `${patternKey}:${subcatKey}`;
    const maps = {
      "squat:symmetric": { "Double Front Squat":40, "Goblet Squat":30, "Hack Squat":30 },
      "hinge:ballistic": { "One-Arm Swing":40, "Two-Arm Swing":30, "Hand-to-Hand Swing":30 },
      "push:vertical": { "Military Press":40, "Half-Kneeling Press":30, "Top-Down Press":30 },
      "pull:ballistic": { "Double Clean":40, "Snatch":40, "High Pull":20 }
    };
    return maps[key] || null;
  }
  const BIG_SIX = new Set(["Swing","Get-Up","Military Press","Double Clean","Double Front Squat","Snatch"]);
  function isBigSixExercise(name){ const exercise=String(name || ""); return BIG_SIX.has(exercise==="One-Arm Swing" || exercise==="Two-Arm Swing" ? "Swing" : exercise); }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = randInt(i+1);
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function refillSubcategoryBag(patternKey, mem){
    const settings = loadExerciseSettings();
    const subcats = Object.keys(LIB[patternKey].subcats).filter(sc => availableFrom(LIB[patternKey].subcats[sc].exercises, settings).length);
    if(!subcats.length){
      subcats.push(...Object.keys(LIB[patternKey].subcats));
    }
    const last = mem.patterns[patternKey].lastSubcat;
    let bag = shuffle(subcats);

    if(last && bag.length > 1 && bag[0] === last){
      const swapIdx = bag.findIndex(sc => sc !== last);
      if(swapIdx > 0){
        [bag[0], bag[swapIdx]] = [bag[swapIdx], bag[0]];
      }
    }

    mem.patterns[patternKey].subcatBag = bag;
  }

  function pickSubcategory(patternKey, mem){
    const patternMem = mem.patterns[patternKey];
    const settings = loadExerciseSettings();
    let subcats = Object.keys(LIB[patternKey].subcats).filter(sc => availableFrom(LIB[patternKey].subcats[sc].exercises, settings).length);
    if(!subcats.length) subcats = Object.keys(LIB[patternKey].subcats);
    if(!patternMem.subcatBag || !patternMem.subcatBag.length){
      refillSubcategoryBag(patternKey, mem);
    }

    let bag = patternMem.subcatBag.filter(sc => subcats.includes(sc));
    const last = patternMem.lastSubcat;

    if(!bag.length){
      refillSubcategoryBag(patternKey, mem);
      bag = patternMem.subcatBag;
    }

    if(last && bag.length > 1 && bag[0] === last){
      const swapIdx = bag.findIndex(sc => sc !== last);
      if(swapIdx > 0){
        [bag[0], bag[swapIdx]] = [bag[swapIdx], bag[0]];
      }
    }

    let picked = bag.shift();

    if(last && picked === last){
      const fallback = subcats.find(sc => sc !== last);
      if(fallback){
        picked = fallback;
        const idx = bag.indexOf(fallback);
        if(idx >= 0) bag.splice(idx, 1);
      }
    }

    patternMem.subcatBag = bag;
    return picked;
  }

  function pickExercise(patternKey, subcatKey, mem){
    const patternMem = mem.patterns[patternKey];
    const settings = loadExerciseSettings();
    let exList = availableFrom(LIB[patternKey].subcats[subcatKey].exercises, settings);
    if(!exList.length){
      exList = LIB[patternKey].subcats[subcatKey].exercises.slice();
    }
    const weights = getPracticeMode() === "progression" ? progressionWeights(patternKey, subcatKey) : null;
    if(weights){
      return weightedChoice(exList, weights);
    }
    if(!patternMem.exerciseBags[subcatKey] || !patternMem.exerciseBags[subcatKey].length){
      refillExerciseBag(patternKey, subcatKey, mem);
    }

    let bag = patternMem.exerciseBags[subcatKey].filter(ex => exList.includes(ex));
    const lastEx = patternMem.lastExerciseBySubcat[subcatKey];

    if(!bag.length){
      refillExerciseBag(patternKey, subcatKey, mem);
      bag = patternMem.exerciseBags[subcatKey];
    }

    if(lastEx && bag.length > 1 && bag[0] === lastEx){
      const swapIdx = bag.findIndex(x => x !== lastEx);
      if(swapIdx > 0){
        [bag[0], bag[swapIdx]] = [bag[swapIdx], bag[0]];
      }
    }

    let picked = bag.shift();

    if(lastEx && picked === lastEx){
      const fallback = exList.find(x => x !== lastEx);
      if(fallback){
        picked = fallback;
        const idx = bag.indexOf(fallback);
        if(idx >= 0) bag.splice(idx, 1);
      }
    }

    patternMem.exerciseBags[subcatKey] = bag;
    return picked;
  }

  function refillExtraBag(type, mem){
    const settings = loadExerciseSettings();
    const fullPool = getExtraPool(type);
    const available = availableFrom(fullPool, settings);
    const pool = available.length ? available : fullPool;
    const last = mem.lastExtraByType[type];
    let bag = shuffle(pool);

    if(last && bag.length > 1 && bag[0] === last){
      const swapIdx = bag.findIndex(ex => ex !== last);
      if(swapIdx > 0){
        [bag[0], bag[swapIdx]] = [bag[swapIdx], bag[0]];
      }
    }

    mem.extraBags[type] = bag;
  }

  function pickExtra(type, mem){
    const settings = loadExerciseSettings();
    const fullPool = getExtraPool(type);
    const available = availableFrom(fullPool, settings);
    const pool = available.length ? available : fullPool;
    if(!mem.extraBags[type] || !mem.extraBags[type].length){
      refillExtraBag(type, mem);
    }

    let bag = mem.extraBags[type].filter(ex => pool.includes(ex));
    const last = mem.lastExtraByType[type];

    if(!bag.length){
      refillExtraBag(type, mem);
      bag = mem.extraBags[type];
    }

    if(last && bag.length > 1 && bag[0] === last){
      const swapIdx = bag.findIndex(ex => ex !== last);
      if(swapIdx > 0){
        [bag[0], bag[swapIdx]] = [bag[swapIdx], bag[0]];
      }
    }

    const picked = bag.shift();
    mem.extraBags[type] = bag;
    mem.lastExtraByType[type] = picked;
    return picked;
  }

  function ladderFor(item, mode){
    const ex = (item.baseExercise || item.exercise || "").toLowerCase();
    const isDouble = ex.includes("double");
    const isBallistic = (item.subcatKey === "ballistic");

    let ladder = "2-3-5";
    if(isBallistic && isDouble) ladder = "4-6-10";
    else if(isBallistic) ladder = "5-10-15";

    if(mode === "MINI"){
      if(ladder === "2-3-5") return "2-3-4";
      if(ladder === "5-10-15") return "5-7-8";
      if(ladder === "4-6-10") return "2-4-6";
    }
    return ladder;
  }

  function applyKettlebellOnlyReplacement(subcatKey, exercise){
    if(!getKettlebellOnly() || subcatKey !== "vertical") return exercise;
    if(exercise === "Chin-up") return "Kettlebell Pull over";
    if(exercise === "Pull-up") return "Kettlebell Halo";
    if(exercise === "False-Grip Pull-up") return "Tall Kneeling Halo";
    return exercise;
  }

  const KB_PATTERN_CYCLE_KEY='pos_kb_pattern_cycle_v1';
  const KB_PATTERN_CYCLE=[['push','pull','squat'],['pull','squat','hinge'],['squat','hinge','push'],['hinge','push','pull']];
  function recordedPatternStep(record){
    if(Number.isInteger(record.kbCycleStep)&&record.kbCycleStep>=0&&record.kbCycleStep<4)return record.kbCycleStep;
    const exercises=(record.exercises||[]).filter(e=>!e.optional);if(exercises.length!==3)return null;
    const patterns=exercises.map(e=>Object.keys(LIB).filter(p=>Object.values(LIB[p].subcats).some(sc=>sc.exercises.includes(e.name))));
    if(patterns.some(p=>p.length!==1))return null;
    const step=KB_PATTERN_CYCLE.findIndex(c=>c.every((p,i)=>p===patterns[i][0]));return step<0?null:step;
  }
  function loadPatternCycle(){
    const state=loadJSON(KB_PATTERN_CYCLE_KEY);
    const last=readLogbook().filter(r=>r.kind==='training'&&(!r.modality||r.modality==='kettlebell')).sort((a,b)=>b.completedAt-a.completedAt)[0];
    const step=last?recordedPatternStep(last):null;
    if(step!==null){const restored={next:(step+1)%4,lastSessionId:last.id};if(state?.next!==restored.next||state?.lastSessionId!==restored.lastSessionId)saveJSON(KB_PATTERN_CYCLE_KEY,restored);return restored;}
    return state&&Number.isInteger(state.next)&&state.next>=0&&state.next<4?state:{next:0};
  }
  function advancePatternCycle(active){
    if(!['FULL','MINI'].includes(active.mode)||(active.modality&&active.modality!=='kettlebell'))return;
    const step=active.session?.kbCycleStep;
    if(!Number.isInteger(step)||step<0||step>3)return;
    const state=loadPatternCycle();if(state.lastSessionId===active.id)return;
    saveJSON(KB_PATTERN_CYCLE_KEY,{next:(step+1)%4,lastSessionId:active.id});
  }
  function generateSession(mode = "MINI"){
    const kbCycleStep=loadPatternCycle().next;
    const patterns=KB_PATTERN_CYCLE[kbCycleStep];
    const mem = loadMemory();
    const exerciseSettings = loadExerciseSettings();
    const picks = [];
    const hypoState = loadHypertrophyState();
    const hypertrophyPattern = hypoState.current;
    let hypertrophyApplied = false;
    for(const patternKey of patterns){
      const subcatKey = pickSubcategory(patternKey, mem);
      const rawEx = pickExercise(patternKey, subcatKey, mem);
      const baseEx = patternKey === "pull" ? applyKettlebellOnlyReplacement(subcatKey, rawEx) : rawEx;
      const ex = customExerciseName(baseEx, exerciseSettings);
      picks.push({
        patternKey,
        patternLabel: LIB[patternKey].label,
        subcatKey,
        subcatLabel: LIB[patternKey].subcats[subcatKey].label,
        baseExercise: baseEx,
        exercise: ex
      });
      mem.patterns[patternKey].lastSubcat = subcatKey;
      mem.patterns[patternKey].lastExerciseBySubcat[subcatKey] = rawEx;
    }

    if(getTrainingStyle() === "hybrid"){
      for(const item of picks){
        if(item.patternKey !== hypertrophyPattern) continue;
        if(!isBallistic(item.subcatKey) && !isBallisticExtraExercise(item.baseExercise || item.exercise)){
          item.hypertrophy = true;
          hypertrophyApplied = true;
        }
        break;
      }
    }

    if(hypertrophyApplied){
      advanceHypertrophy(hypoState);
    }

    let optional = null;
    let optionalBase = null;
    let optionalType = null;
    if(mode === "FULL"){
      optionalType = mem.nextExtraType === "hypertrophy" ? "hypertrophy" : "core";
      optionalBase = pickExtra(optionalType, mem);
      optional = customExerciseName(optionalBase, exerciseSettings);
      mem.nextExtraType = optionalType === "core" ? "hypertrophy" : "core";
    }

    const circuit = picks;
    const availableCarries = availableFrom(CARRIES, exerciseSettings);
    const carryPool = availableCarries.length ? availableCarries : CARRIES;
    const carryAllowed = carryPool.filter(c => c !== mem.lastCarry);
    const carryChoices = carryAllowed.length ? carryAllowed : carryPool;
    const carryWeights = getPracticeMode() === "progression"
      ? { "Get-Up":25, "Suitcase Carry":15, "Front Rack Carry":15, "Overhead Carry":15, "Front Rack March":15, "Cook Drill March":15 }
      : null;
    const carryBase = carryWeights ? weightedChoice(carryChoices, carryWeights) : choice(carryChoices);
    const carry = customExerciseName(carryBase, exerciseSettings);
    mem.lastCarry = carryBase;
    return { circuit, carry, carryBase, optional, optionalBase, optionalType, memNext: mem, kbCycleStep };
  }

  // -------------------------

  const confCanvas = document.getElementById('confettiCanvas');
  const confCtx = confCanvas.getContext('2d');
  function confettiBurst(ms=1400){
    const w = confCanvas.width = window.innerWidth;
    const h = confCanvas.height = window.innerHeight;
    confCanvas.style.display = 'block';
    const pieces = Array.from({length: 160}, () => ({
      x: Math.random()*w,
      y: -20 - Math.random()*h*0.2,
      vx: (Math.random()*2-1)*6,
      vy: 3 + Math.random()*8,
      s: 4 + Math.random()*6,
      r: Math.random()*Math.PI*2,
      vr: (Math.random()*2-1)*0.2,
      a: 1,
    }));
    const start = performance.now();
    const draw = (t) => {
      const elapsed = t - start;
      confCtx.clearRect(0,0,w,h);
      for(const p of pieces){
        p.x += p.vx;
        p.y += p.vy;
        p.r += p.vr;
        p.vy *= 0.99;
        p.vx *= 0.995;
        if(elapsed > ms*0.6) p.a = Math.max(0, 1 - (elapsed - ms*0.6) / (ms*0.4));
        confCtx.save();
        confCtx.globalAlpha = p.a;
        confCtx.translate(p.x,p.y);
        confCtx.rotate(p.r);
        // no fixed colors: use varying grayscale + accent tint
        const shade = 180 + Math.floor(Math.random()*60);
        confCtx.fillStyle = `rgba(${shade},${shade},${shade},${p.a})`;
        confCtx.fillRect(-p.s/2, -p.s/2, p.s, p.s*0.6);
        confCtx.restore();
      }
      if(elapsed < ms){ requestAnimationFrame(draw); }
      else { confCtx.clearRect(0,0,w,h); confCanvas.style.display='none'; }
    };
    requestAnimationFrame(draw);
  }

      if(t._persistTick) t._persistTick(left, total);

  const breathSeq = [
    { phase:'IN', sec:3, scale:1.20 },
    { phase:'HOLD', sec:1, scale:1.20 },
    { phase:'OUT', sec:6, scale:0.80 },
    { phase:'HOLD', sec:2, scale:0.80 },
  ];

  function renderBreathing(active){
    leftCard.innerHTML = `
      <h2>Breathing (3-1-6-2)</h2>
      <div class="breathBox">
        <div class="ring">
          <div class="ringInner" id="ringInner">
            <div>
              <div class="phase" id="phaseTxt">IN</div>
              <div class="phaseSub" id="phaseSub">3s</div>
            </div>
          </div>
        </div>
        <div class="progress"><div id="prog"></div></div>
        <div class="small" id="totalLeft">-</div>
      </div>
      <div class="hr"></div>
      <div class="row">
        <button id="btnBack" class="btn">Back</button>
        <button id="btnFinish" class="btn danger">Finish session</button>
      </div>
    `;

    const ringInner = document.getElementById('ringInner');
    const phaseTxt = document.getElementById('phaseTxt');
    const phaseSub = document.getElementById('phaseSub');
    const prog = document.getElementById('prog');
    const totalLeft = document.getElementById('totalLeft');

    function setPhase(p){
      phaseTxt.textContent = p.phase;
      ringInner.style.transform = `scale(${p.scale})`;
    }

    // Initialize from active
    const total = active.timers.breathTotal ?? (active.timers.breathTotal = (active.timers.breathLeft ?? 300));
    const breathCycleSec = breathSeq.reduce((sum, p) => sum + p.sec, 0);
    let lastBreathPhase = active.timers.breathPhase || 'IN';

    function syncBreathPhase(a, allowBeep=false){
      a.timers = a.timers || {};
      const left = Math.max(0, a.timers.breathLeft ?? total);
      const elapsed = Math.max(0, total - left);
      let cyclePos = breathCycleSec ? elapsed % breathCycleSec : 0;
      let phase = breathSeq[0];
      for(const candidate of breathSeq){
        if(cyclePos < candidate.sec){
          phase = candidate;
          break;
        }
        cyclePos -= candidate.sec;
      }

      const nextLeft = Math.max(1, phase.sec - Math.floor(cyclePos));
      const changed = a.timers.breathPhase && a.timers.breathPhase !== phase.phase;
      a.timers.breathPhase = phase.phase;
      a.timers.breathPhaseLeft = nextLeft;
      a.timers.breathPhaseSec = phase.sec;

      if(allowBeep && changed && lastBreathPhase !== phase.phase){
        beep(1);
      }
      lastBreathPhase = phase.phase;
      return phase;
    }

    function updateUI(){
      const a = loadActive();
      if(!a) return;
      const phase = syncBreathPhase(a, false);
      saveActive(a);
      const left = a.timers.breathLeft;
      const pct = total ? (1 - left/total) * 100 : 0;
      prog.style.width = `${Math.max(0, Math.min(100, pct))}%`;
      totalLeft.textContent = `${fmt(left)} left`;
      phaseTxt.textContent = a.timers.breathPhase;
      phaseSub.textContent = `${a.timers.breathPhaseLeft}s`;
      ringInner.style.transform = `scale(${phase.scale})`;
    }

    // Breathing timer is custom (phase-based)
    if(timers.breathing) timers.breathing.pause();

    timers.breathing = makeTimer(active.timers.breathLeft ?? 300, (left, totalIgnored) => {
      const a = loadActive();
      if(!a) return;
      a.timers.breathLeft = left;
      syncBreathPhase(a, timers.breathing && timers.breathing.running);
      saveActive(a);
      updateUI();
    });
    timers.breathing.left = Math.max(0, active.timers.breathLeft ?? 300);

    // Right panel for breathing uses timers.breathing (start/pause/reset), but with wakelock
    renderRightTimer('Breathing', 'breathing');
    setModePill('-');

    // Patch the right panel buttons to also control wakelock
    const startBtn = rightInner.querySelector('#btnStart');
    const pauseBtn = rightInner.querySelector('#btnPause');
    const resetBtn = rightInner.querySelector('#btnResetT');

    startBtn.addEventListener('click', () => {
      requestWakeLock();
      const a = loadActive();
      if(!a) return;
      // if no phase init
      if(!a.timers.breathPhase){ a.timers.breathPhase = 'IN'; a.timers.breathPhaseLeft = 3; }
      syncBreathPhase(a, false);
      saveActive(a);
    }, { once:false });

    pauseBtn.addEventListener('click', () => {
      // pause already handled by renderRightTimer
      releaseWakeLock();
    }, { once:false });

    resetBtn.addEventListener('click', () => {
      const a = loadActive();
      if(!a) return;
      a.timers.breathLeft = a.timers.breathTotal ?? (a.timers.breathTotal = (a.timers.breathLeft ?? 300));
      a.timers.breathPhase = 'IN';
      a.timers.breathPhaseLeft = 3;
      a.timers.breathPhaseSec = 3;
      saveActive(a);
      timers.breathing.reset();
      releaseWakeLock();
      updateUI();
    }, { once:false });

    // bootstrap phase visuals
    const a0 = loadActive();
    if(a0 && !a0.timers.breathPhase){
      a0.timers.breathPhase = 'IN';
      a0.timers.breathPhaseLeft = 3;
      a0.timers.breathPhaseSec = 3;
      saveActive(a0);
    }
    updateUI();

    document.getElementById('btnBack').addEventListener('click', () => {
      releaseWakeLock();
      const a = loadActive();
      if(a){ a.phase = 'MOBILITY'; saveActive(a); }
      boot();
    });
    document.getElementById('btnFinish').addEventListener('click', () => {
      releaseWakeLock();
      completeSession();
    });

    // ensure no wakelock until user starts
    releaseWakeLock();
  }

  // -------------------------

  function recordCompletionOnce(active){
    if(!active) return;
    sessionIdentity(active);
    if(active.completionRecorded){if(readLogbook().some(r=>r.id===active.id))writePracticeLog(active);return;}
    active.completedAt=Date.now();writePracticeLog(active);recordModality(active);advancePatternCycle(active);
    recordWidgetCompletion(active.mode==='FULL'||active.mode==='MINI'?'training':'recovery');
    if(!active.supplemental&&typeof active.sessionNumber==='number'){countCompletedPracticeSession(active.sessionNumber);countCompletedProgressionTrainingSession(active);}
    active.completionRecorded=true;saveActive(active);
    const day=loadDayState();if(day&&!active.supplemental){day.completed=true;saveDayState(day);}
  }
  function completeSession(){
    const a=loadActive();recordCompletionOnce(a);
    const summaryLine=a?.mode==='ZONE2'?'Zone 2 saved in your logbook.':a && (a.mode==='FULL'||a.mode==='MINI') ? 'Training saved.' : 'Recovery saved.';
    clearActive();
    document.body.classList.remove("practicing");
    // keep day state locked until tomorrow OR user resets; this matches your idea
    // (If you want unlock on finish, uncomment next line)
    // localStorage.removeItem(LS_DAY_KEY);

    // Stop timers and wakelock
    Object.values(timers).forEach(t => { try{ t && t.pause && t.pause(); }catch{} });
    releaseWakeLock();

    confettiBurst();
    btnMain.textContent = 'Options';
    btnMain.classList.add('main-action');
    setModePill("-");

    if(a&&!a.supplemental){
      const fs = loadFullStreak();
      if(a.mode === 'FULL'){
        fs.n = (fs.n || 0) + 1;
      } else {
        fs.n = 0;
      }
      saveFullStreak(fs);
    }
    // Show summary screen
    leftCard.innerHTML = `
      <h2>Session complete ✓</h2>
      <p class="small">${summaryLine}</p>
      ${completionReflection(a?.id)}
      <div class="hr"></div>
      <div class="row"><button id="btnHome" class="btn primary">Back to start</button>${extraSessionButton()}</div>
    `;
    bindAdditional();bindFeelings(leftCard);
    document.getElementById('btnHome').addEventListener('click', () => {
      // allow new start same day only if you reset; otherwise show locked state
      boot();
    });
    renderRightNone();
    // Check the completed-session Bell Test reminder.
    try{ maybeShowBellTestReminder(); }catch{}

  }

  // -------------------------
  // Boot / Router
  // -------------------------
  function boot(){
    if(!welcomeAccepted()){showSafetyNotice();return;}
    if(localStorage.getItem('pos_intro_seen_v1')!==WELCOME_VERSION){showProgramIntroduction();return;}
    if(maybeOpeningScreen())return;
    syncWidget();
    if(localStorage.getItem("wotb_focus_pending_v3") === "1"){ openNextCycleChoice(); return; }
    updateTrainPill();
    updateKettlebellOnlyPill();
    initTrainPillEditor();
    
    const day = loadDayState();
    const active = loadActive();
    document.body.classList.toggle("practicing",!!active);

    if(active && active.phase==='TRAINING' && active.gateVersion!==2){
      active.practiceMode='progression';active.trainingStyle=getTrainingStyle();active.gateVersion=2;
      active.timers=active.timers||{};active.timers.circuitLeft=Math.min(1200,active.timers.circuitLeft??1200);saveActive(active);
    }
    if(active){
      btnMain.textContent = 'Options';
      // route by phase
      if(active.phase === 'ZONE2') return renderZone2Session(active);
      if(active.phase === 'TRAINING') return renderTraining(active);
      if(active.phase === 'BENCHMARK_ZONE2') return renderBenchmarkZone2(active);
      if(active.phase === 'MOBILITY')  return renderMobility(active);
      if(active.phase === 'WALK_PICKER') return renderWalkPicker();
      if(active.phase === 'WALK')      return renderWalk(active);
      if(active.phase === 'BREATHING') return renderBreathing(active);
    }

    const mandatoryRestUntil = postBenchmarkRestUntil();
    if(mandatoryRestUntil){
      btnMain.textContent = 'Options';
      setModePill("TEST COMPLETE");
      renderRightNone();
      leftCard.innerHTML = `
        <h2>Bell Test Complete</h2>
        <p class="small">Today's Candidate Bell Test counts as your practice. There is no additional mandatory rest period.</p>
        <div class="hr"></div>
        <div class="benchmarkHistoryItem">
          <strong>Return tomorrow and use the normal Recovery Gate</strong>
          <div class="small">Settings and Bell Test history remain available.</div>
        </div>
      `;
      return;
    }

    if(day && day.modeLocked){
      btnMain.textContent='Options';renderRightNone();
      leftCard.innerHTML='<h2>'+(day.completed?'Practice complete ✓':'Today’s practice')+'</h2><p class="small">'+modeName(day.modeLocked)+'</p><div class="row">'+(day.completed?'':'<button id="btnStartFromLock" class="btn primary">Open practice</button>')+(day.completed?extraSessionButton():'')+'<button id="btnResetDay" class="btn">Change today’s gate</button></div>';
      bindAdditional();
      const start=document.getElementById('btnStartFromLock');if(start)start.onclick=()=>{startPractice(day);boot();};
      document.getElementById('btnResetDay').onclick=()=>{localStorage.removeItem(LS_DAY_KEY);clearActive();boot();};
      return;
    }

    // default: gate
    btnMain.textContent = 'Options';
    renderGate(null);
    if(shouldShowFirstRunOnboarding()) openFirstRunOnboarding();
  }

  function openPracticeModeSelector(){
    stopRest();
    Object.values(timers).forEach(t=>{try{t?.pause();}catch{}});

  function bindSetCounters(id){

  const MAX_BACKUP_BYTES=4*1024*1024;
  function validateBackup(text){
    if(typeof text!=='string'||new Blob([text]).size>MAX_BACKUP_BYTES)throw Error('The backup is too large (maximum 4 MB).');
    let backup;try{backup=JSON.parse(text);}catch{throw Error('This file is not valid JSON.');}
    const plain=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
    if(!plain(backup)||backup.app!=='way-of-the-bell'||backup.schema!==1||!plain(backup.data)||!Number.isFinite(Date.parse(backup.createdAt)))throw Error('This is not a supported Path Of Strength backup.');
    const safeTree=(value,depth=0)=>{
      if(depth>30)throw Error('The backup contains invalid nested data.');
      if(typeof value==='string'&&/[<>]/.test(value))throw Error('The backup contains unsupported text.');
      if(value&&typeof value==='object')for(const key of Object.keys(value)){if(['__proto__','prototype','constructor'].includes(key))throw Error('The backup contains invalid fields.');safeTree(value[key],depth+1);}
    };
    for(const [key,value]of Object.entries(backup.data)){
      if(!BACKUP_KEYS.includes(key)||typeof value!=='string')throw Error('The backup contains unsupported settings.');
      if(key===LS_LESSON_TODAY_KEY){if(!LESSONS.includes(value))throw Error('The backup contains an unknown lesson.');continue;}
      if(key===LS_LESSON_KEY){const bag=JSON.parse(value);if(!Array.isArray(bag)||!bag.every(x=>LESSONS.includes(x)))throw Error('Invalid lesson collection.');continue;}
      if(JSON_BACKUP_KEYS.includes(key)){
        let parsed;try{parsed=JSON.parse(value);}catch{throw Error('The backup contains invalid saved data.');}safeTree(parsed);
        if(ARRAY_BACKUP_KEYS.includes(key)){if(!Array.isArray(parsed))throw Error('Invalid list in backup.');}
        else if(!plain(parsed))throw Error('Invalid saved object in backup.');
      }else safeTree(value);
    }
    const get=key=>Object.hasOwn(backup.data,key)?JSON.parse(backup.data[key]):null;
    const log=get(LOGBOOK_KEY)||[];
    const countValid=x=>x===null||(Number.isInteger(x)&&x>=0&&x<=999);
    const repsValid=x=>x===null||(Number.isInteger(x)&&x>=0&&x<=9999);
    const ids=new Set();
    for(const r of log){
      if(!plain(r)||typeof r.id!=='string'||ids.has(r.id)||!Number.isFinite(r.completedAt)||!['training','walking','recovery','zone2'].includes(r.kind)||!Array.isArray(r.exercises)||!r.exercises.every(ex=>plain(ex)&&typeof ex.name==='string'&&countValid(ex.sets)&&(ex.reps===undefined||repsValid(ex.reps))))throw Error('Invalid training logbook.');ids.add(r.id);
      if(r.carry&&(!plain(r.carry)||typeof r.carry.name!=='string'||!['pending','completed','skipped'].includes(r.carry.status)||!Number.isFinite(r.carry.durationSeconds)||r.carry.durationSeconds<0||r.carry.durationSeconds>300))throw Error('Invalid carry record.');
      if(r.kind==='zone2'&&(!Number.isInteger(r.durationSeconds)||r.durationSeconds<60||r.durationSeconds>18000||!['Walking','Cycling','Rowing','Other'].includes(r.activity)))throw Error('Invalid Zone 2 record.');
      if(r.kind==='training'&&(!r.modality||r.modality==='kettlebell')&&(![900,1200,1500,1800].includes(r.circuitSeconds)||!Number.isFinite(r.bellKg)||!['strength','hypertrophy'].includes(r.focus)))throw Error('Invalid training details.');
    }
    for(const key of [LS_TRAIN_COUNT_KEY,LS_PROGRESS_COUNT_KEY,LS_FULL_STREAK_KEY]){const value=get(key);if(value&&(!Number.isFinite(value.n)||value.n<0))throw Error('Invalid progress counter.');}

  }

  const POS_PREFS='pos_preferences_v1', POS_ROTATION='pos_rotation_v1', POS_EQUIPMENT='pos_equipment_v1';
  const MODALITIES=['kettlebell','barbell','bodyweight'];
  const MODALITY_LABEL={kettlebell:'Kettlebell',barbell:'Barbell',bodyweight:'Bodyweight'};
  const POS_VARIANTS={
    barbell:{A:['Barbell Back Squat','Bench Press','Sumo Deadlift'],B:['Front Squat','Shoulder Press','Conventional Deadlift'],C:['Zercher Squat','Incline Bench Press','Goodmorning']},
    bodyweight:{A:['Pistol Squat','Handstand Push Up','Tactical Pull Up'],B:['Top Down Pistol','One-arm Push Up','Front Lever / Hanging Leg Raise']}
  };
  function posPreferences(){
    const p=loadJSON(POS_PREFS)||{};
    const selected=Array.isArray(p.enabledModalities)?MODALITIES.filter(m=>p.enabledModalities.includes(m)):MODALITIES.slice();
    const enabledModalities=selected.length?selected:MODALITIES.slice();
    const selectedWork=Array.isArray(p.workModalities)?enabledModalities.filter(m=>p.workModalities.includes(m)):[];
    const workModalities=selectedWork.length?selectedWork:[enabledModalities.includes('kettlebell')?'kettlebell':enabledModalities[0]];
    return {enabledModalities,workModalities};
  }
  function posRotation(){
    const saved=loadJSON(POS_ROTATION)||{};
    const history=readLogbook().filter(r=>r.kind==='training').sort((a,b)=>b.completedAt-a.completedAt);
    const lastAlternative=history.find(r=>POS_VARIANTS[r.modality]);
    const lastVariants={...saved.lastVariants};
    for(const m of ['barbell','bodyweight']){
      const last=history.find(r=>r.modality===m&&POS_VARIANTS[m][r.variant]);
      if(!lastVariants[m]&&last)lastVariants[m]=last.variant;
    }
    return {...saved,lastModality:saved.lastModality||history[0]?.modality||'kettlebell',lastAlternative:saved.lastAlternative||lastAlternative?.modality||null,lastVariants};
  }
  function nextAlternative(rotation=posRotation()){
    const allowed=['barbell','bodyweight'].filter(m=>posPreferences().enabledModalities.includes(m));
    return allowed.find(m=>m!==rotation.lastAlternative)||allowed[0]||null;
  }
  function variantLabel(modality,variant){return modality==='bodyweight'?({A:'1',B:'2'}[variant]||variant):variant;}
  function posSession(modality,rotation=posRotation()){
    const variants=POS_VARIANTS[modality],keys=Object.keys(variants);
    const variant=keys[(keys.indexOf(rotation.lastVariants?.[modality])+1)%keys.length];
    return {variant,circuit:variants[variant].map(exercise=>({exercise,baseExercise:exercise,patternLabel:MODALITY_LABEL[modality]}))};
  }
  function recordModality(active){

  function showProgramIntroduction(review=false){
    appModal.dataset.locked=review?'0':'1';
    openModal({title:'The practice is the path',text:'Daily practice for attention, strength and physical capacity.',bodyHTML:'<div class="intro-copy">'+(review?"<section aria-label=\"Breadth With Structure\"><h3>Breadth With Structure</h3><p>Strength is not only what you can lift in perfect conditions. It is what remains available when life asks for something unexpected.</p><p>Learn the basics deeply, but do not let mastery become limitation. Carry, climb, sprint, rise, reach, brace, adapt. Build a body with more than one answer.</p><p>Let the Big Six be your roots, not your cage.</p><p>Choose a path broad enough for life, structured enough for progress, and simple enough to keep walking.</p><p>Then stop redesigning the road. Practice it.</p></section><div class=\"hr\"></div>":'')+'<h3>Train your attention</h3><p>Read the Lesson of the Day and choose one idea to put into practice.</p><h3>Build your capacity</h3><p>Kettlebell is the default. A daily recovery check guides the session. Train three patterns in a four-session cycle; only completed kettlebell circuits advance it.</p><p>Use controlled sets of 3–5 reps for grinds and 5–10 for ballistics in Strength focus. Build good work within the circuit; rest as needed. Workdays have the circuit only; free days can add optional carry and accessories.</p><h3>Own your starting bell</h3><p>Calibrate with all six Big Six skills, one round with full rest. The next Bell Test is available after 28 completed strength-training days, with reminders at 42 and 56. KB, BB and BW count, at most once per date. Zone 2 and recovery count toward monthly practices, but not toward the Bell Test. Passing all six at the next weight unlocks that bell.</p><h3>Choose your practice</h3><p>Choose Other strength training to follow the automatic barbell A/B/C and bodyweight 1/2 rotation. Only completed alternatives advance it; kettlebell stays your default. Available alternatives can be changed in Options. Active Recovery and Zone 2 remain separate choices. After finishing, you can log a separate Zone 2 or recovery session. Extra sessions do not advance your kettlebell cycle.</p><p>Use the logbook to review your practice and Backup &amp; restore to save your data.</p></div>',actionsHTML:'<button id="introDone" class="btn primary">'+(review?'Back':'Begin practice')+'</button>'});
    document.getElementById('introDone').onclick=()=>{if(!review)localStorage.setItem('pos_intro_seen_v1',WELCOME_VERSION);appModal.dataset.locked='0';closeModal();if(review)openPracticeModeSelector();else boot();};
  }
  function extraSessionButton(){return '<button id="btnAdditional" class="btn">Add Zone 2 / recovery</button>';}
  function bindAdditional(){const b=document.getElementById('btnAdditional');if(b)b.onclick=openAdditionalSession;}
  function pauseAllTimers(){Object.values(timers).forEach(t=>t?.pause());stopRest();releaseWakeLock();}
  function openAdditionalSession(){
    const a=loadActive();if(a&&!a.completionRecorded)return;
    pauseAllTimers();
    openModal({title:'Additional session',text:'Save a separate entry. Your completed training and kettlebell cycle stay intact.',actionsHTML:'<button id="extraZone2" class="btn primary">Zone 2</button><button id="extraRecovery" class="btn">Active Recovery</button><button id="extraCancel" class="btn">Cancel</button>'});
    document.getElementById('extraZone2').onclick=()=>openZone2Setup(true);
    document.getElementById('extraRecovery').onclick=()=>startSupportSession('RECOVERY',true);
    document.getElementById('extraCancel').onclick=()=>{closeModal();boot();};
  }
  function startSupportSession(mode,supplemental,settings={}){
    const old=loadActive();if(!supplemental&&(!old||old.completionRecorded))return;
    if(supplemental&&old&&!old.completionRecorded)return;
    pauseAllTimers();
    const a=sessionIdentity({day:todayKey(),mode,phase:mode==='ZONE2'?'ZONE2':'MOBILITY',supplemental,gateVersion:2,timers:mode==='ZONE2'?{zone2Left:settings.plannedSeconds}:{mobilityLeft:DUR.mobilitySec},mobilityChecks:{},...settings});
    if(!supplemental){a.sessionNumber=old.sessionNumber;const day=loadDayState();if(day){day.modeLocked=mode;saveDayState(day);}}
    saveActive(a);closeModal();boot();return a;
  }
  function openZone2Setup(supplemental=false){
    openModal({title:'Zone 2',text:supplemental?'Add a separate session, now or after you have done it.':'Replace this session with Zone 2.',bodyHTML:'<label class="cal-weight">Activity<select id="zone2Activity"><option>Walking</option><option>Cycling</option><option>Rowing</option><option>Other</option></select></label><label class="cal-weight">Minutes<input id="zone2Minutes" class="benchmarkInput" type="number" min="1" max="300" step="1" required value="20"></label><p class="small">Use your usual easy aerobic effort. Duration alone does not verify your heart-rate zone.</p>',actionsHTML:'<button id="startZone2Session" class="btn primary">Start timer</button><button id="logZone2Session" class="btn">Log completed session</button><button id="cancelZone2Setup" class="btn">Cancel</button>'});
    const start=manual=>{const input=document.getElementById('zone2Minutes');if(!input.reportValidity())return;const a=startSupportSession('ZONE2',supplemental,{plannedSeconds:Number(input.value)*60,activity:document.getElementById('zone2Activity').value});if(!a)return;if(manual){a.durationSeconds=a.plannedSeconds;a.manualEntry=true;saveActive(a);completeSession();}else document.getElementById('btnStart').click();};
    document.getElementById('startZone2Session').onclick=()=>start(false);document.getElementById('logZone2Session').onclick=()=>start(true);
    document.getElementById('cancelZone2Setup').onclick=()=>{closeModal();boot();};
  }
  function renderZone2Session(active){
    leftCard.innerHTML='<h2>Zone 2</h2><p>'+escapeHTML(active.activity)+' · '+active.plannedSeconds/60+' minutes</p><p class="small">'+(active.supplemental?'Additional session. Your earlier training is already saved.':'An easy aerobic practice today.')+'</p><div class="row"><button id="finishZone2" class="btn primary">Finish &amp; log</button><button id="discardZone2" class="btn">Discard</button></div>';
    timers.zone2=makeTimer(active.plannedSeconds,left=>{const a=loadActive();if(a?.id===active.id){a.timers.zone2Left=left;saveActive(a);}});
    timers.zone2.left=active.timers.zone2Left;renderRightTimer('Zone 2','zone2');setModePill('Zone 2');
    document.getElementById('finishZone2').onclick=()=>{
      timers.zone2.pause();const a=loadActive();
      const elapsed=Math.max(1,Math.round((a.plannedSeconds-a.timers.zone2Left)/60));
      openModal({title:'Save Zone 2',text:'Confirm the minutes you actually completed.',bodyHTML:'<label class="cal-weight">Completed minutes<input id="zone2CompletedMinutes" class="benchmarkInput" type="number" min="1" max="300" step="1" required value="'+elapsed+'"></label>',actionsHTML:'<button id="confirmZone2Log" class="btn primary">Save session</button><button id="backZone2" class="btn">Back</button>'});
      document.getElementById('confirmZone2Log').onclick=()=>{const input=document.getElementById('zone2CompletedMinutes');if(!input.reportValidity())return;const current=loadActive();current.durationSeconds=Number(input.value)*60;current.manualEntry=false;saveActive(current);closeModal();completeSession();};
      document.getElementById('backZone2').onclick=()=>{closeModal();boot();};
    };
    document.getElementById('discardZone2').onclick=()=>{pauseAllTimers();openModal({title:'Discard this Zone 2 session?',text:'This session will not be logged. Any earlier training remains saved.',actionsHTML:'<button id="confirmDiscardZone2" class="btn danger">Discard</button><button id="keepZone2" class="btn">Keep session</button>'});document.getElementById('confirmDiscardZone2').onclick=()=>{const a=loadActive();clearActive();if(!a.supplemental)localStorage.removeItem(LS_DAY_KEY);closeModal();boot();};document.getElementById('keepZone2').onclick=()=>{closeModal();boot();};};
  }


  function practiceRecords(){const seen=new Set();return readLogbook().filter(r=>['training','zone2','walking','recovery'].includes(r.kind)&&Number.isFinite(r.completedAt)&&!seen.has(r.id)&&(seen.add(r.id),true));}
  function practiceSummary(date=new Date()){
    const all=practiceRecords(),records=all.filter(r=>{const d=new Date(r.completedAt);return d.getFullYear()===date.getFullYear()&&d.getMonth()===date.getMonth()&&r.completedAt<=date.getTime();});
    return {month:date.toLocaleDateString('en-GB',{month:'long',year:'numeric'}),total:records.length,all:all.filter(r=>r.completedAt<=date.getTime()).length,strength:records.filter(r=>r.kind==='training').length,zone2:records.filter(r=>r.kind==='zone2').length,recovery:records.filter(r=>['walking','recovery'].includes(r.kind)).length};
  }
  function renderPracticeCount(){const el=document.getElementById('practiceHeader');if(!el)return;const p=practiceSummary();el.innerHTML='<span style="display:block;font-size:11px;font-weight:normal">'+p.month+'</span><span>'+p.total+' '+(p.total===1?'practice':'practices')+'</span>';el.onclick=()=>{openModal({title:p.month,text:p.total+' practices · Keep returning.',bodyHTML:'<p>'+p.strength+' strength · '+p.zone2+' Zone 2 · '+p.recovery+' recovery</p><p class="small">'+p.all+' practices recorded in total. Earlier sessions stay in your logbook.</p>',actionsHTML:'<button id="practiceCountClose" class="btn">Close</button>'});document.getElementById('practiceCountClose').onclick=closeModal;};}
  const MONTHLY_KEY='pos_monthly_v1';
  function monthlyState(){return loadJSON(MONTHLY_KEY)||{entries:[],deferredUntil:0};}
  function monthKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
  function monthlyDue(){const d=new Date(),first=new Date(d.getFullYear(),d.getMonth(),1);first.setDate(1+(7-first.getDay())%7);const state=monthlyState();return Date.now()>=first.getTime()&&Date.now()>=state.deferredUntil&&!state.entries.some(e=>e.month===monthKey());}
  function deferMonthly(){const s=monthlyState(),next=new Date();next.setHours(0,0,0,0);next.setDate(next.getDate()+1);s.deferredUntil=next.getTime();saveJSON(MONTHLY_KEY,s);closeModal();boot();}
  function renderMonthlyPrompt(){const el=document.getElementById('monthlyCard');if(!el)return;el.hidden=!!loadActive()||!monthlyDue();if(el.hidden)return;el.innerHTML='<strong>A moment to reflect</strong><p class="small">Your monthly check-in is ready. Two minutes, at your own pace.</p><div class="row"><button id="monthlyOpen" class="btn">Check in</button><button id="monthlyLater" class="btn">Later</button></div>';document.getElementById('monthlyOpen').onclick=openMonthlyCheckin;document.getElementById('monthlyLater').onclick=deferMonthly;}
  function welcomeBack(){const last=readLogbook().filter(r=>r.kind==='training').reduce((n,r)=>Math.max(n,r.completedAt),0);return last&&Date.now()-last>=7*86400000?'<section class="daily-lesson"><h3>Welcome back</h3><p>Your earlier work is still here. No catching up needed. Start with how you feel today.</p></section>':'';}
  function feelingControls(r){if(!r||r.kind==='bell-test')return '';return '<div class="session-feeling" data-feeling-id="'+escapeHTML(r.id)+'"><p class="small">How did this feel? <span>Optional</span></p><div class="row">'+[['light','Light'],['good','Good'],['heavy','Heavy']].map(([v,label])=>'<button class="btn '+(r.feeling===v?'primary':'')+'" data-feeling="'+v+'" aria-pressed="'+(r.feeling===v)+'">'+label+'</button>').join('')+'<button class="btn" data-feeling="">Clear</button></div><p class="small" data-feeling-status role="status">'+(r.feeling?'Saved. No change to your program.':'')+'</p></div>';}
  function bindFeelings(root){root?.querySelectorAll('[data-feeling-id]').forEach(row=>row.querySelectorAll('[data-feeling]').forEach(button=>button.onclick=()=>{const logs=readLogbook(),r=logs.find(x=>x.id===row.dataset.feelingId);if(!r)return;if(button.dataset.feeling)r.feeling=button.dataset.feeling;else delete r.feeling;saveJSON(LOGBOOK_KEY,logs);row.querySelectorAll('[data-feeling]').forEach(b=>{const selected=!!r.feeling&&b.dataset.feeling===r.feeling;b.classList.toggle('primary',selected);b.setAttribute('aria-pressed',String(selected));});row.querySelector('[data-feeling-status]').textContent=r.feeling?'Saved. No change to your program.':'Cleared.';}));}
  function completionReflection(id){const r=readLogbook().find(r=>r.id===id);return r?positiveProgress(r)+feelingControls(r):'';}
  function openMonthlyCheckin(){
    const state=monthlyState(),current=state.entries.find(e=>e.month===monthKey())||{},now=new Date(),from=new Date(now.getFullYear(),now.getMonth()-1,1).getTime(),to=new Date(now.getFullYear(),now.getMonth(),1).getTime();
    const logs=readLogbook().filter(r=>r.completedAt>=from&&r.completedAt<to),strength=logs.filter(r=>r.kind==='training').length,zone=logs.filter(r=>r.kind==='zone2').length,recovery=logs.filter(r=>['recovery','walking'].includes(r.kind)).length;
    const feelings=['light','good','heavy'].map(f=>logs.filter(r=>r.feeling===f).length);
    const highlights=logs.filter(r=>r.kind==='training').sort((a,b)=>b.completedAt-a.completedAt).flatMap(r=>(r.exercises||[]).map(ex=>({name:ex.name,text:exerciseProgress(r,ex)})).filter(x=>x.text)).slice(0,3);
    const field=(key,label)=>'<label style="display:block;margin-top:12px">'+label+'<textarea id="monthly-'+key+'" maxlength="500" rows="2" style="display:block;width:100%;box-sizing:border-box;font:inherit;padding:8px;border:1px solid #b7c0b0;border-radius:8px;background:#fffdf8">'+escapeHTML(current[key]||'')+'</textarea></label>';
    const history=state.entries.slice().sort((a,b)=>b.at-a.at).slice(0,12).map(e=>'<details><summary>'+escapeHTML(e.month)+' · '+new Date(e.at).toLocaleDateString('en-GB')+'</summary><p class="small">'+(e.weight==null?'':'Weight: '+e.weight+' kg · ')+(e.fat==null?'':'Body fat: '+e.fat+'%')+'</p>'+[['wentWell','What went well'],['barrier','What got in the way'],['plan','One small agreement']].map(([k,label])=>e[k]?'<p class="small"><strong>'+label+':</strong> '+escapeHTML(e[k])+'</p>':'').join('')+'</details>').join('');
    openModal({title:'Monthly check-in · '+monthKey(),text:'Look back, then choose one small step. Everything here is optional.',bodyHTML:'<p><strong>Previous calendar month</strong><br>'+strength+' strength · '+zone+' Zone 2 · '+recovery+' recovery sessions</p><p class="small">Recorded feelings: '+feelings[0]+' light · '+feelings[1]+' good · '+feelings[2]+' heavy</p>'+highlights.map(x=>'<p class="small"><strong>'+escapeHTML(x.name)+'</strong> · '+escapeHTML(x.text)+'</p>').join('')+field('wentWell','What went well?')+field('barrier','What made starting difficult?')+field('plan','One small agreement for the coming month')+'<h3>Optional measurements</h3><p class="small">Personal observations, not a score or target. The measurement date is the day you save.</p><div class="row"><label>Body weight (kg)<input id="monthly-weight" style="display:block;width:100%;box-sizing:border-box;font:inherit;padding:8px;border:1px solid #b7c0b0;border-radius:8px;background:#fffdf8" type="number" min="0.1" max="500" step="0.1" inputmode="decimal" value="'+(current.weight??'')+'"></label><label>Body fat (%)<input id="monthly-fat" style="display:block;width:100%;box-sizing:border-box;font:inherit;padding:8px;border:1px solid #b7c0b0;border-radius:8px;background:#fffdf8" type="number" min="0" max="100" step="0.1" inputmode="decimal" value="'+(current.fat??'')+'"></label></div>'+(history?'<h3>Your check-ins</h3>'+history:'')+'<p id="monthlyError" role="alert"></p>',actionsHTML:'<button id="monthlyCancel" class="btn">Later</button><button id="monthlySave" class="btn primary">Save check-in</button>'});
    document.getElementById('monthlyCancel').onclick=deferMonthly;
    document.getElementById('monthlySave').onclick=()=>{
      const weight=document.getElementById('monthly-weight'),fat=document.getElementById('monthly-fat');if(!weight.reportValidity()||!fat.reportValidity())return;
      const e={month:monthKey(),at:Date.now(),weight:weight.value===''?null:Number(weight.value),fat:fat.value===''?null:Number(fat.value)};
      for(const key of ['wentWell','barrier','plan']){e[key]=document.getElementById('monthly-'+key).value.trim();if(/[<>]/.test(e[key])){document.getElementById('monthlyError').textContent='Please use plain text without angle brackets.';return;}}
      state.entries=state.entries.filter(x=>x.month!==e.month);state.entries.push(e);state.deferredUntil=0;saveJSON(MONTHLY_KEY,state);closeModal();boot();
    };
  }

  function openingDue(){return localStorage.getItem('pos_opening_seen_day_v1')!==todayKey()&&!loadActive()&&!Object.values(timers).some(t=>t?.running);}
  function maybeOpeningScreen(){
    const el=document.getElementById('practiceOpening');if(!el.hidden)return true;
    if(!welcomeAccepted()||localStorage.getItem('pos_intro_seen_v1')!==WELCOME_VERSION||!openingDue()||appModal.classList.contains('show'))return false;
    el.hidden=false;document.body.classList.add('opening-visible');document.querySelector('.wrap').inert=true;
    const begin=document.getElementById('beginDailyPractice');begin.onclick=()=>{localStorage.setItem('pos_opening_seen_day_v1',todayKey());el.hidden=true;document.body.classList.remove('opening-visible');document.querySelector('.wrap').inert=false;boot();document.getElementById('btnMain').focus();try{maybeShowBellTestReminder();}catch{}};
    begin.focus();return true;
  }

  // First boot
  setupInstallPrompt();
  setWakeStatus(false);
  renderRightNone();
    // Check the completed-session Bell Test reminder.
    try{ maybeShowBellTestReminder(); }catch{}

  boot();
  window.pollBellFiles();
})();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>
</body>
